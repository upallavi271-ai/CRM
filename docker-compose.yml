services:
  postgres:
    image: postgres:17
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm-pgdata:/var/lib/postgresql/data

volumes:
  crm-pgdata:
